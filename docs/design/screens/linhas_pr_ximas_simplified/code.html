<html class="light" lang="pt-BR" style="">
  <head>

              tertiary: "#011928",

              "on-primary-fixed-variant": "#474744",
              "on-tertiary-container": "#7f96a8",
              "on-secondary-container": "#6f6349",
              "surface-container-high": "#e9e8e4",
              "on-surface": "#1b1c1a",
              "on-primary": "#ffffff",
              "accent-yellow": "#FFF1B5",

    <style>
      body {
        background-color: #faf9f5; /* Warm Alabaster */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .editorial-shadow {
        box-shadow: 0 32px 64px -12px rgba(27, 28, 26, 0.04);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e3e2df;
        border-radius: 10px;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="font-body-md text-on-surface selection:bg-secondary-container bg-background"
    style="background-color: rgb(250, 249, 245)"
  >
    <!-- TopAppBar -->

    <main
      class="pb-32 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto pt-12"
    >
      <!-- Hero Section -->
      <section class="mb-12">
        <h2
          class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-2 animate-in fade-in slide-in-from-bottom-4 duration-700"
        >
          Linhas Próximas
        </h2>
        <p class="font-body-md text-muted-text flex items-center gap-2">
          <span class="material-symbols-outlined text-[16px]">location_on</span>
          Baseado na sua localização atual.
        </p>
      </section>
      <!-- Route List -->
      <div class="space-y-4 bg-background">
        <!-- Route 1 -->
        <div
          class="group relative flex items-center justify-between p-6 rounded-xl border border-outline/10 bg-white/50 hover:bg-white transition-all duration-300 editorial-shadow hover:scale-[1.01] cursor-pointer"
        >
          <div class="flex items-center gap-6">
            <div
              class="w-14 h-14 flex items-center justify-center bg-primary text-white rounded-full font-label-md"
            >
              233
            </div>
            <div>
              <h3
                class="font-headline-sm text-lg text-primary mb-1 font-body-md"
              >
                TICAN / TITRI via UFSC
              </h3>
            </div>
          </div>
          <div class="text-right">
            <span class="font-label-md text-secondary block">120m</span
            ><span
              class="material-symbols-outlined text-outline/30 group-hover:text-primary transition-colors"
              >chevron_right</span
            >
          </div>
        </div>
        <!-- Route 2 -->
        <div
          class="group relative flex items-center justify-between p-6 rounded-xl border border-outline/10 bg-white/50 hover:bg-white transition-all duration-300 editorial-shadow hover:scale-[1.01] cursor-pointer"
        >
          <div class="flex items-center gap-6">
            <div
              class="w-14 h-14 flex items-center justify-center bg-primary text-white rounded-full font-label-md"
            >
              185
            </div>
            <div>
              <h3
                class="font-headline-sm text-lg text-primary mb-1 font-body-md"
              >
                UFSC Semidireto
              </h3>
            </div>
          </div>
          <div class="text-right">
            <span class="font-label-md text-secondary block">350m</span
            ><span
              class="material-symbols-outlined text-outline/30 group-hover:text-primary transition-colors"
              >chevron_right</span
            >
          </div>
        </div>
        <!-- Route 3 -->
        <div
          class="group relative flex items-center justify-between p-6 rounded-xl border border-outline/10 bg-white/50 hover:bg-white transition-all duration-300 editorial-shadow hover:scale-[1.01] cursor-pointer"
        >
          <div class="flex items-center gap-6">
            <div
              class="w-14 h-14 flex items-center justify-center bg-primary text-white rounded-full font-label-md"
            >
              135
            </div>
            <div>
              <h3
                class="font-headline-sm text-lg text-primary mb-1 font-body-md"
              >
                Volta ao Morro Norte
              </h3>
            </div>
          </div>
          <div class="text-right">
            <span class="font-label-md text-secondary block">480m</span
            ><span
              class="material-symbols-outlined text-outline/30 group-hover:text-primary transition-colors"
              >chevron_right</span
            >
          </div>
        </div>
        <!-- Route 4 -->
        <div
          class="group relative flex items-center justify-between p-6 rounded-xl border border-outline/10 bg-white/50 hover:bg-white transition-all duration-300 editorial-shadow hover:scale-[1.01] cursor-pointer"
        >
          <div class="flex items-center gap-6">
            <div
              class="w-14 h-14 flex items-center justify-center bg-primary text-white rounded-full font-label-md"
            >
              330
            </div>
            <div>
              <h3
                class="font-headline-sm text-lg text-primary mb-1 font-body-md"
              >
                TILAG / TICEN
              </h3>
            </div>
          </div>
          <div class="text-right">
            <span class="font-label-md text-secondary block">600m</span
            ><span
              class="material-symbols-outlined text-outline/30 group-hover:text-primary transition-colors"
              >chevron_right</span
            >
          </div>
        </div>
      </div>
      <!-- Atmospheric Card -->
    </main>
    <!-- BottomNavBar -->

    <script>
      // Micro-interactions for list items
      document.querySelectorAll(".group").forEach((item) => {
        item.addEventListener("mouseenter", () => {
          // Subtle feedback if needed
        });

        item.addEventListener("click", () => {
          // Click animation
          item.classList.add("scale-95");
          setTimeout(() => item.classList.remove("scale-95"), 150);
        });
      });

      // Sticky header opacity on scroll
      window.addEventListener("scroll", () => {
        const header = document.querySelector("header");
        if (window.scrollY > 20) {
          header.classList.add("bg-white/80", "backdrop-blur-md");
          header.classList.remove("bg-background");
        } else {
          header.classList.remove("bg-white/80", "backdrop-blur-md");
          header.classList.add("bg-background");
        }
      });
    </script>
  </body>
</html>
