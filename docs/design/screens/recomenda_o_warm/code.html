<!doctype html>
<html lang="pt-BR" style="">
  <head></head>
  <body
    class="min-h-screen w-full flex flex-col items-center justify-center overflow-hidden"
  >
    <svg
      class="inline-defs-container"
      aria-hidden="true"
      style="position: absolute; width: 0; height: 0; overflow: hidden"
    ></svg
    ><meta charset="utf-8" /><meta
      content="width=device-width, initial-scale=1.0"
      name="viewport"
    /><link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block"
      rel="stylesheet"
    /><link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,700;1,400;1,700&amp;family=Satoshi:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      try {
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                primary: "#197fe6",
                "background-light": "#fdfaf3",
                "background-dark": "#1a1c18",
                "brand-primary": "#1C1C1A",
                "brand-bg": "#FDF9F0" /* Warmer sun-kissed cream */,
                "brand-surface": "#FEFDFC",
                "brand-text": "#2C2C2A",
                "brand-muted": "#7A766B",
                "brand-shade":
                  "#2B6CB0" /* Slightly deeper blue for harmony with warm bg */,
                "brand-sun": "#F6AD55" /* Richer sun orange-yellow */,
                "brand-border": "#E8E2D2",
              },
              fontFamily: {
                display: ["Newsreader", "serif"],
                body: ["Satoshi", "sans-serif"],
              },
              borderRadius: {
                DEFAULT: "0.5rem",
                lg: "1rem",
                xl: "1.5rem",
                full: "9999px",
              },
              keyframes: {
                "slide-in-rays": {
                  "0%": {
                    transform: "translateX(20px) translateY(-20px)",
                    opacity: "0",
                  },
                  "100%": {
                    transform: "translateX(0) translateY(0)",
                    opacity: "1",
                  },
                },
                "pulse-shade": {
                  "0%, 100%": { opacity: "1" },
                  "50%": { opacity: "0.6" },
                },
                "fade-in-up": {
                  "0%": { opacity: "0", transform: "translateY(10px)" },
                  "100%": { opacity: "1", transform: "translateY(0)" },
                },
              },
              animation: {
                "slide-rays": "slide-in-rays 1s ease-out forwards",
                "pulse-shade": "pulse-shade 2s ease-in-out infinite",
                "fade-up": "fade-in-up 0.6s ease-out forwards",
              },
            },
          },
        };
      } catch (_e) {}
    </script>
    <div
      class="relative w-full max-w-md min-h-screen bg-background flex flex-col justify-between p-6 opacity-0 animate-fade-up sm:rounded-[32px] sm:min-h-[800px] sm:my-8"
      id="app-container"
      style="background-color: rgb(250, 249, 245)"
    >
      <!-- Custom Minimal Header -->

      <!-- Content Area -->
      <main class="flex-1 flex flex-col items-center w-full">
        <!-- Typography Block -->
        <div class="w-full text-left mb-10 pl-2">
          <h1
            class="font-display text-[36px] font-bold leading-[1.1] text-primary tracking-[-0.02em] mb-3"
            style="color: rgb(23, 24, 22); font-family: Newsreader, serif"
          >
            Sente à <em class="italic">esquerda</em>.
          </h1>
          <p
            class="font-body text-[16px] text-muted-text leading-[1.5]"
            style="font-family: Satoshi, sans-serif"
          >
            O sol baterá na direita durante 85% da viagem.
          </p>
        </div>
        <!-- Bus Diagram Container -->
        <div
          class="relative flex-1 flex items-center justify-center w-full min-h-[350px]"
        >
          <!-- The SVG Graphic -->
          <svg
            class="w-[200px] h-[300px] drop-shadow-xl"
            fill="none"
            viewBox="0 0 200 300"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect
              fill="#ffffff"
              height="280"
              rx="40"
              stroke="#e3e2df"
              stroke-width="2"
              width="160"
              x="20"
              y="10"
            ></rect>
            <path
              d="M40 30 Q 100 15 160 30"
              fill="none"
              stroke="#e3e2df"
              stroke-width="2"
            ></path>
            <path
              d="M40 270 Q 100 285 160 270"
              fill="none"
              stroke="#e3e2df"
              stroke-width="2"
            ></path>
            <line
              stroke="#e3e2df"
              stroke-dasharray="4 4"
              stroke-width="1"
              x1="100"
              x2="100"
              y1="50"
              y2="250"
            ></line>
            <g class="fill-primary" style="fill: rgb(155, 178, 197)">
              <rect height="15" rx="4" width="45" x="40" y="60"></rect>
              <rect height="15" rx="4" width="45" x="40" y="90"></rect>
              <rect height="15" rx="4" width="45" x="40" y="120"></rect>
              <rect height="15" rx="4" width="45" x="40" y="150"></rect>
              <rect height="15" rx="4" width="45" x="40" y="180"></rect>
              <rect height="15" rx="4" width="45" x="40" y="210"></rect>
              <rect height="15" rx="4" width="45" x="40" y="240"></rect>
            </g>
            <g class="fill-accent-yellow" style="fill: rgb(229, 213, 181)">
              <rect height="15" rx="4" width="45" x="115" y="60"></rect>
              <rect height="15" rx="4" width="45" x="115" y="90"></rect>
              <rect height="15" rx="4" width="45" x="115" y="120"></rect>
              <rect height="15" rx="4" width="45" x="115" y="150"></rect>
              <rect height="15" rx="4" width="45" x="115" y="180"></rect>
              <rect height="15" rx="4" width="45" x="115" y="210"></rect>
              <rect height="15" rx="4" width="45" x="115" y="240"></rect>
            </g>
          </svg>
          <!-- Sun Rays Overlay (Animated) -->
          <svg
            class="absolute top-0 right-0 w-full h-full pointer-events-none"
            fill="none"
            viewBox="0 0 200 300"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <linearGradient id="rayGradient" x1="1" y1="0" x2="0" y2="1">
                <stop
                  offset="0%"
                  stop-color="#e5d5b5"
                  stop-opacity="0.8"
                ></stop>
                <stop
                  offset="100%"
                  stop-color="#e5d5b5"
                  stop-opacity="0"
                ></stop>
              </linearGradient>
            </defs>
            <g class="sun-ray">
              <line
                x1="220"
                y1="20"
                x2="140"
                y2="100"
                stroke="url(#rayGradient)"
                stroke-width="0.5"
              ></line>
              <line
                x1="230"
                y1="40"
                x2="150"
                y2="120"
                stroke="url(#rayGradient)"
                stroke-width="0.5"
              ></line>
              <line
                x1="240"
                y1="60"
                x2="160"
                y2="140"
                stroke="url(#rayGradient)"
                stroke-width="0.5"
              ></line>
              <line
                x1="250"
                y1="80"
                x2="170"
                y2="160"
                stroke="url(#rayGradient)"
                stroke-width="0.5"
              ></line>
              <line
                x1="260"
                y1="100"
                x2="180"
                y2="180"
                stroke="url(#rayGradient)"
                stroke-width="0.5"
              ></line>
              <line
                x1="270"
                y1="120"
                x2="190"
                y2="200"
                stroke="url(#rayGradient)"
                stroke-width="0.5"
              ></line>
              <line
                x1="280"
                y1="140"
                x2="200"
                y2="220"
                stroke="url(#rayGradient)"
                stroke-width="0.5"
              ></line>
            </g>
            <circle
              class="sun-ray"
              cx="210"
              cy="30"
              fill="#e5d5b5"
              opacity="0.1"
              r="40"
            ></circle>
            <circle
              class="sun-ray"
              cx="210"
              cy="30"
              fill="#e5d5b5"
              opacity="0.4"
              r="15"
            ></circle>
          </svg>
        </div>
      </main>
      <!-- Footer Action -->
    </div>

      // Trigger entry animations when DOM is ready
      document.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          document.
    </script>
  </body>
</html>
