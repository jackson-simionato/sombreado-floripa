<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Sombreado Floripa brand examples</title>
  <desc id="desc">A documentation board showing Sombreado Floripa as a delightful companion with palette, recommendation card, route candidate, and bus-side split motif.</desc>
  <defs>
    <pattern id="sunHatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="12" height="12" fill="#FCE6B8"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#F8B84E" stroke-width="4"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8A6B3C" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="980" fill="#FFF9EE"/>

  <text x="72" y="92" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="42" font-weight="760">Sombreado Floripa</text>
  <text x="72" y="132" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="20">Delightful bus companion, direct enough to trust while moving.</text>

  <g transform="translate(72 176)">
    <text x="0" y="0" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="20" font-weight="700">Palette</text>
    <g transform="translate(0 24)">
      <rect x="0" y="0" width="132" height="96" rx="8" fill="#F8B84E"/>
      <text x="16" y="126" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="16" font-weight="700">Sun</text>
      <text x="16" y="150" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="14">#F8B84E</text>
      <rect x="156" y="0" width="132" height="96" rx="8" fill="#4E9CB5"/>
      <text x="172" y="126" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="16" font-weight="700">Shade</text>
      <text x="172" y="150" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="14">#4E9CB5</text>
      <rect x="312" y="0" width="132" height="96" rx="8" fill="#FFFFFF" stroke="#E7DED2"/>
      <text x="328" y="126" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="16" font-weight="700">Paper</text>
      <text x="328" y="150" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="14">#FFFFFF</text>
      <rect x="468" y="0" width="132" height="96" rx="8" fill="#25211B"/>
      <text x="484" y="126" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="16" font-weight="700">Ink</text>
      <text x="484" y="150" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="14">#25211B</text>
    </g>
  </g>

  <g transform="translate(742 176)" filter="url(#softShadow)">
    <rect x="0" y="0" width="386" height="360" rx="24" fill="#FFFFFF"/>
    <rect x="24" y="24" width="112" height="34" rx="17" fill="#FCE6B8"/>
    <text x="40" y="47" fill="#6B3F00" font-family="Inter, Avenir, system-ui, sans-serif" font-size="14" font-weight="760">Agora no ônibus</text>
    <text x="24" y="106" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="34" font-weight="780">Sente à esquerda</text>
    <text x="24" y="144" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="18">Esse lado deve pegar menos sol direto.</text>
    <rect x="24" y="168" width="338" height="126" rx="20" fill="#F7FBFC" stroke="#D8E9EE"/>
    <text x="150" y="192" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="12" font-weight="650">motorista / frente</text>
    <path d="M194 205v-14m-6 6 6-6 6 6" fill="none" stroke="#25211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(124 207)">
      <rect x="0" y="0" width="138" height="72" rx="18" fill="#FFFFFF" stroke="#D9CDC0" stroke-width="1.5"/>
      <rect x="12" y="12" width="48" height="48" rx="14" fill="#DDF1F5" stroke="#4E9CB5" stroke-width="2"/>
      <rect x="78" y="12" width="48" height="48" rx="14" fill="url(#sunHatch)" stroke="#F8B84E" stroke-width="2"/>
      <rect x="62" y="12" width="14" height="48" rx="7" fill="#FFFFFF" stroke="#E7DED2"/>
      <path d="m28 36 7 7 15-18" fill="none" stroke="#4E9CB5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="102" cy="32" r="8" fill="#6B3F00"/>
      <path d="M102 18v-8M102 54v-8M88 32h-8M124 32h-8M92 22l-6-6M118 48l-6-6M112 22l6-6M86 48l6-6" stroke="#6B3F00" stroke-width="2" stroke-linecap="round"/>
      <text x="36" y="82" fill="#1D5466" font-family="Inter, Avenir, system-ui, sans-serif" font-size="11" font-weight="760" text-anchor="middle">esquerda</text>
      <text x="102" y="82" fill="#6B3F00" font-family="Inter, Avenir, system-ui, sans-serif" font-size="11" font-weight="760" text-anchor="middle">sol direto</text>
    </g>
    <text x="24" y="326" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="14">Estimativa pelo sol direto. Pode variar no caminho.</text>
  </g>

  <g transform="translate(72 520)">
    <text x="0" y="0" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="20" font-weight="700">Bus orientation diagram</text>
    <g transform="translate(0 28)">
      <rect x="0" y="0" width="486" height="386" rx="26" fill="#FFFFFF" stroke="#E7DED2"/>

      <!-- front marker -->
      <text x="184" y="38" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="14" font-weight="650">motorista / frente</text>
      <path d="M244 56v-18m-7 7 7-7 7 7" fill="none" stroke="#25211B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- square schematic, not bus silhouette -->
      <g transform="translate(136 70)">
        <rect x="0" y="0" width="216" height="252" rx="28" fill="#FFFFFF" stroke="#D9CDC0" stroke-width="2"/>
        <rect x="16" y="16" width="78" height="220" rx="20" fill="#EDF7F9"/>
        <rect x="122" y="16" width="78" height="220" rx="20" fill="#FFF7E7"/>
        <rect x="96" y="20" width="24" height="212" rx="12" fill="#FFFFFF" stroke="#E7DED2" stroke-width="1"/>
        <text x="110" y="143" fill="#9A9186" font-family="Inter, Avenir, system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90 110 143)">CORREDOR</text>

        <!-- left / recommended seats -->
        <rect x="34" y="34" width="42" height="28" rx="8" fill="#DDF1F5" stroke="#4E9CB5" stroke-width="2"/>
        <rect x="34" y="74" width="42" height="28" rx="8" fill="#DDF1F5" stroke="#4E9CB5" stroke-width="2"/>
        <rect x="34" y="114" width="42" height="28" rx="8" fill="#DDF1F5" stroke="#4E9CB5" stroke-width="2"/>
        <rect x="34" y="154" width="42" height="28" rx="8" fill="#DDF1F5" stroke="#4E9CB5" stroke-width="2"/>
        <rect x="34" y="194" width="42" height="28" rx="8" fill="#DDF1F5" stroke="#4E9CB5" stroke-width="2"/>

        <!-- right / direct sun seats -->
        <rect x="140" y="34" width="42" height="28" rx="8" fill="url(#sunHatch)" stroke="#F8B84E" stroke-width="2"/>
        <rect x="140" y="74" width="42" height="28" rx="8" fill="url(#sunHatch)" stroke="#F8B84E" stroke-width="2"/>
        <rect x="140" y="114" width="42" height="28" rx="8" fill="url(#sunHatch)" stroke="#F8B84E" stroke-width="2"/>
        <rect x="140" y="154" width="42" height="28" rx="8" fill="url(#sunHatch)" stroke="#F8B84E" stroke-width="2"/>
        <rect x="140" y="194" width="42" height="28" rx="8" fill="url(#sunHatch)" stroke="#F8B84E" stroke-width="2"/>
      </g>

      <!-- left recommendation callout -->
      <path d="M134 196H88" stroke="#4E9CB5" stroke-width="3" stroke-linecap="round"/>
      <path d="m88 196-9-8-9 8 9 8Z" fill="#4E9CB5"/>
      <rect x="22" y="146" width="56" height="100" rx="20" fill="#4E9CB5"/>
      <text x="57" y="231" fill="#FFFFFF" font-family="Inter, Avenir, system-ui, sans-serif" font-size="13" font-weight="800" transform="rotate(-90 57 231)">SENTA AQUI</text>
      <text x="38" y="232" fill="#FFFFFF" font-family="Inter, Avenir, system-ui, sans-serif" font-size="11" font-weight="650" transform="rotate(-90 38 232)">lado esquerdo</text>
      <path d="m40 162 7 7 13-15" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- sun exposure callout -->
      <path d="M354 166H408" stroke="#F8B84E" stroke-width="3" stroke-linecap="round"/>
      <path d="m408 166 8-8 8 8-8 8Z" fill="#F8B84E"/>
      <rect x="418" y="116" width="50" height="100" rx="18" fill="#F8B84E"/>
      <text x="449" y="198" fill="#6B3F00" font-family="Inter, Avenir, system-ui, sans-serif" font-size="13" font-weight="800" transform="rotate(90 449 198)">SOL DIRETO</text>
      <text x="431" y="197" fill="#6B3F00" font-family="Inter, Avenir, system-ui, sans-serif" font-size="11" font-weight="650" transform="rotate(90 431 197)">pega sol direto</text>
      <circle cx="443" cy="134" r="10" fill="#6B3F00"/>
    </g>
  </g>

  <g transform="translate(628 572)">
    <text x="0" y="0" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="20" font-weight="700">Copy posture</text>
    <rect x="0" y="28" width="500" height="112" rx="18" fill="#FFFFFF" stroke="#E7DED2"/>
    <text x="24" y="68" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="22" font-weight="760">Curto, local, direto.</text>
    <text x="24" y="102" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="17">"Melhor sentar à direita" antes de "exposição solar: baixa".</text>
  </g>

  <g transform="translate(628 740)">
    <text x="0" y="0" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="20" font-weight="700">Route confirmation</text>
    <rect x="0" y="28" width="500" height="92" rx="18" fill="#FFFFFF" stroke="#E7DED2"/>
    <rect x="24" y="50" width="70" height="48" rx="16" fill="#EDF7F9" stroke="#C7E3EA"/>
    <text x="59" y="81" fill="#1D5466" font-family="Inter, Avenir, system-ui, sans-serif" font-size="18" font-weight="780" text-anchor="middle">124</text>
    <text x="118" y="68" fill="#25211B" font-family="Inter, Avenir, system-ui, sans-serif" font-size="20" font-weight="740">TICEN → Lagoa</text>
    <text x="118" y="96" fill="#6B6258" font-family="Inter, Avenir, system-ui, sans-serif" font-size="15">perto de você · sentido Lagoa</text>
    <path d="M446 74h22m-8-8 8 8-8 8" fill="none" stroke="#4E9CB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
